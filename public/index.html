<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageKit Upload Test</title>
</head>
<body>

```
<h2>Upload Image to ImageKit</h2>

<input type="file" id="imageInput" accept="image/*">

<br><br>

<button onclick="uploadImage()">Upload</button>

<p id="result"></p>

<script>
    async function uploadImage() {

        const input = document.getElementById("imageInput");
        const result = document.getElementById("result");

        if (!input.files.length) {
            result.innerText = "Please select an image first.";
            return;
        }

        const formData = new FormData();
        formData.append("image", input.files[0]);

        result.innerText = "Uploading...";

        try {
            const response = await fetch("/upload", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (data.success) {
                result.innerText =
                    "Upload successful!\nImage URL: " + data.url;
            } else {
                result.innerText =
                    "Upload failed: " + data.message;
            }

        } catch (error) {
            console.error(error);
            result.innerText = "Connection error.";
        }
    }
</script>
```

</body>
</html>
